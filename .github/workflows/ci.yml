name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analisis-estatico-y-pruebas-puras:
    name: Ruff + pruebas puras (HU-1, HU-2, HU-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (configuración heredada de Odoo, ruff.toml)
        run: |
          pip install "ruff==0.15.10"  # misma versión que docs/evidencia/ruff.txt
          ruff --version
          ruff check addons/hr_expense/models/expense_rules.py addons/hr_expense/tests/test_expense_*.py addons/hr_expense/tests/_pure.py
      - name: Pruebas puras (unittest, sin Odoo)
        run: scripts/run_pure_tests.sh

  suite-odoo:
    name: Suite Odoo hr_expense (TransactionCase, HU-3 y HU-4 modelo)
    runs-on: ubuntu-latest
    needs: analisis-estatico-y-pruebas-puras
    steps:
      - uses: actions/checkout@v4
      - name: Suite completa del módulo en odoo:19 + postgres:16
        run: |
          docker compose run --rm odoo 2>&1 | tee odoo_tests.log | grep -E "odoo.tests.result|ERROR|FAIL" || true
          grep -E "0 failed, 0 error\(s\) of [0-9]+ tests" odoo_tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odoo_tests.log
          path: odoo_tests.log
